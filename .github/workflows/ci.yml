name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.24', '1.25']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      - name: cli smoke
        # the sample contains findings, so exit 1 is the expected result; anything
        # else (a usage error or a crash) must fail the job
        run: |
          # `||` keeps `set -e` from aborting on the findings exit code before it is checked
          go run ./cmd/reorglens analyze samples/reorged.jsonl || [ $? -eq 1 ]
